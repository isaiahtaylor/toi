name: site

# Monthly data update (pipeline) and GitHub Pages deploy.
# - schedule / workflow_dispatch: run the pipeline, commit data/, publish a data release,
#   then deploy the site.
# - push to main touching the site, data, pipeline or docs: deploy only.

on:
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - 'pipeline/**'
      - 'docs/**'

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      catalog_date: ${{ steps.pipeline.outputs.catalog_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the pipeline
        run: python3 -m unittest discover -s pipeline/tests

      - name: Run the pipeline
        id: pipeline
        run: |
          python3 -m pipeline.run --cache "$RUNNER_TEMP/toi-inputs" --out data
          catalog_date=$(python3 -c 'import json; print(json.load(open("data/latest.json"))["catalog_date"])')
          echo "catalog_date=$catalog_date" >> "$GITHUB_OUTPUT"

      - name: Build the site (smoke test)
        run: python3 web/build.py

      - name: Commit data
        env:
          CATALOG_DATE: ${{ steps.pipeline.outputs.catalog_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data/."
          else
            git commit -m "data: monthly update $CATALOG_DATE"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_DATE: ${{ steps.pipeline.outputs.catalog_date }}
        run: |
          shopt -s nullglob
          tag="data-${CATALOG_DATE:0:7}"
          files=("$RUNNER_TEMP"/toi-inputs/*.tsv "$RUNNER_TEMP"/toi-inputs/*.csv
                 "$RUNNER_TEMP"/toi-inputs/*.meta.json
                 data/latest.json data/objects.csv data/buses.json data/history.csv)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "TOI data $CATALOG_DATE" \
              --notes "Inputs (GCAT, CelesTrak SATCAT) and outputs of the monthly TOI run for catalog date $CATALOG_DATE. Input checksums are listed in latest.json under sources. GCAT data: Jonathan C. McDowell, CC-BY-4.0. SATCAT: USSPACECOM via CelesTrak."
          fi

  deploy:
    needs: update
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # the latest default branch, so a fresh data commit from the update job is included
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the site
        run: python3 web/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
