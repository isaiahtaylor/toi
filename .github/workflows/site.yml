name: site

# Monthly data update. Vercel deploys the site on every push to main (see vercel.json),
# including the data commit this job pushes, so there is no deploy job here.
# - schedule, or a manual run from the default branch: run the pipeline, commit data/,
#   and publish the month's data release.

on:
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    # Scheduled runs always use the default branch. Manual runs from another branch would
    # commit data there while Vercel serves the default branch, so they skip the update.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: toi-data-update
      cancel-in-progress: false
    outputs:
      catalog_date: ${{ steps.pipeline.outputs.catalog_date }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test the pipeline
        run: python3 -m unittest discover -s pipeline/tests

      # Exits with status 2 and writes nothing if GCAT is unavailable; the job then fails,
      # nothing is committed or deployed, and the site keeps last month's data.
      - name: Run the pipeline
        id: pipeline
        run: |
          python3 -m pipeline.run --cache "$RUNNER_TEMP/toi-inputs" --out data
          catalog_date=$(python3 -c 'import json; print(json.load(open("data/latest.json"))["catalog_date"])')
          echo "catalog_date=$catalog_date" >> "$GITHUB_OUTPUT"

      - name: Build the site (smoke test)
        run: python3 web/build.py

      - name: Commit data
        id: commit
        env:
          CATALOG_DATE: ${{ steps.pipeline.outputs.catalog_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data/."
          else
            git commit -m "data: monthly update $CATALOG_DATE"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One release per catalog month, tagged on the data commit. A second run in the same
      # month replaces the release, so its tag, inputs and outputs always belong together.
      # The data is already pushed at this point, so a failure here must not fail the run.
      - name: Publish data release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_DATE: ${{ steps.pipeline.outputs.catalog_date }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          shopt -s nullglob
          tag="data-${CATALOG_DATE:0:7}"
          files=("$RUNNER_TEMP"/toi-inputs/*.tsv "$RUNNER_TEMP"/toi-inputs/*.csv
                 "$RUNNER_TEMP"/toi-inputs/*.meta.json
                 data/latest.json data/objects.csv data/buses.json data/history.csv)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "${files[@]}" --target "$SHA" \
            --title "TOI data $CATALOG_DATE" \
            --notes "Inputs (GCAT, CelesTrak SATCAT) and outputs of the monthly TOI run for catalog date $CATALOG_DATE. Input checksums are listed in latest.json under sources. GCAT data: Jonathan C. McDowell, CC-BY-4.0. SATCAT: USSPACECOM via CelesTrak."
