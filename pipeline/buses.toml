# Curated satellite designs for the Taylor Occlusion Index.
#
# Each [[design]] forms its own display group. Matching (payloads only), in order of
# precedence: match.norad (catalog numbers), match.gcat_bus (exact GCAT Bus strings),
# then match.name_regex (case-insensitive, tried on the CelesTrak and GCAT names; used
# when the object has no GCAT Bus yet or the design lists no Bus strings).
#
# Areas, one of:
#   body = { a_m, b_m } and arrays = { n, length_m, width_m, tracking }   flat-panel formula
#       A_abs = a*b + n*L*w + extra
#       A_fac = a*b + f*n*L*w + extra        f: sun 0.5, earth 1, edge 0
#       P_fac = 2(a+b) + n*2(L + f*w) - 2n*min(f*w, b)   (arrays attached to the b sides)
#   direct = { A_abs_m2, A_fac_m2, P_fac_m }     for shapes the formula does not fit
#   area_model = "gcat"                          GCAT dimensions through the generic model
#
# confidence: published | estimated | assumed | proxy
# alt_history (optional): altitude rule for the reconstructed history. On station the
# satellites fly at shell_km before `until`, then move linearly to their current altitude
# by `ramp_until`. Within raise_days of launch and descent_days of decay they are in
# transit at min(transit_km, own altitude).
#
# Never cite Gunter's Space Page: its terms forbid reuse.

schema_version = 1

# ------------------------------------------------------------------ Starlink
[[design]]
id = "starlink-v1"
label = "Starlink v1.0 / v1.5"
family = "Starlink"
confidence = "published"
match = { gcat_bus = ["Starlink"], norad = [], name_regex = '^STARLINK[- ][1-6]\d{3}$' }
body = { a_m = 1.3, b_m = 2.8 }
arrays = { n = 1, length_m = 8.1, width_m = 2.8, tracking = "sun" }
extra_area_m2 = 0.0
alt_history = { shell_km = 550.0, until = "2026-01-01", ramp_until = "2026-10-01", raise_days = 45, descent_days = 120, transit_km = 350.0 }
notes = """
Mallama et al. (2023) give a 1.3 x 2.8 m antenna panel and one 2.8 x 8.1 m solar array,
26.32 m2 in all, unchanged from the first launches through v1.5. On station the panel
faces Earth and the array tracks the Sun, so the array counts at one half in the facing
area. These satellites flew at about 550 km until SpaceX lowered about 4,400 satellites to
about 480 km during 2026. The reconstruction keeps them at 550 km until 1 January 2026 and
moves each one linearly to its current altitude by 1 October 2026.
"""
[[design.sources]]
title = "Mallama et al. 2023, Assessment of Brightness Mitigation Practices for Starlink Satellites"
url = "https://arxiv.org/abs/2309.14152"
[[design.sources]]
title = "McDowell, Starlink satellite dimensions from SpaceX's October 2022 FCC filing"
url = "https://planet4589.org/astro/starsim/index.html"
[[design.sources]]
title = "SpaceX, Brightness Mitigation Best Practices for Satellite Operators"
url = "https://api.starlink.com/public-files/BrightnessMitigationBestPracticesSatelliteOperators.pdf"
[[design.sources]]
title = "Engadget, Starlink is lowering thousands of satellites' orbits (1 January 2026)"
url = "https://www.engadget.com/science/space/starlink-is-lowering-thousands-of-satellites-orbits-to-reduce-risk-of-collisions-030509067.html"

[[design]]
id = "starlink-v2-mini"
label = "Starlink V2 Mini"
family = "Starlink"
confidence = "published"
match = { gcat_bus = ["Starlink V2M"], norad = [], name_regex = '^STARLINK[- ]3[0-2]\d{3}$' }
body = { a_m = 2.7, b_m = 4.1 }
arrays = { n = 2, length_m = 12.8, width_m = 4.1, tracking = "sun" }
extra_area_m2 = 0.0
alt_history = { shell_km = 530.0, until = "2026-01-01", ramp_until = "2026-10-01", raise_days = 45, descent_days = 120, transit_km = 350.0 }
notes = """
Mallama et al. (2023) give a 2.7 x 4.1 m antenna panel and two 4.1 x 12.8 m solar arrays,
116.0 m2 in all. The panel faces Earth. The arrays track the Sun and turn edge-on to Earth
near the day-night line (SpaceX calls this terminator tracking), so they count at one half
in the facing area. The FCC authorized the first Gen2 satellites in shells at 525, 530 and
535 km; the reconstruction uses 530 km until 1 January 2026, then ramps to each
satellite's current altitude by 1 October 2026, as for v1.
"""
[[design.sources]]
title = "Mallama et al. 2023, Assessment of Brightness Mitigation Practices for Starlink Satellites"
url = "https://arxiv.org/abs/2309.14152"
[[design.sources]]
title = "SpaceX, Brightness Mitigation Best Practices for Satellite Operators"
url = "https://api.starlink.com/public-files/BrightnessMitigationBestPracticesSatelliteOperators.pdf"
[[design.sources]]
title = "FCC 22-91, SpaceX Gen2 order and authorization (1 December 2022)"
url = "https://docs.fcc.gov/public/attachments/FCC-22-91A1.pdf"
[[design.sources]]
title = "Engadget, Starlink is lowering thousands of satellites' orbits (1 January 2026)"
url = "https://www.engadget.com/science/space/starlink-is-lowering-thousands-of-satellites-orbits-to-reduce-risk-of-collisions-030509067.html"

[[design]]
id = "starlink-v2-mini-optimized"
label = "Starlink V2 Mini Optimized"
family = "Starlink"
confidence = "assumed"
match = { gcat_bus = ["Starlink V2MO"], norad = [], name_regex = '^STARLINK[- ]3[3-9]\d{3}$' }
body = { a_m = 2.7, b_m = 4.1 }
arrays = { n = 2, length_m = 12.8, width_m = 4.1, tracking = "sun" }
extra_area_m2 = 0.0
alt_history = { shell_km = 530.0, until = "2026-01-01", ramp_until = "2026-10-01", raise_days = 45, descent_days = 120, transit_km = 350.0 }
notes = """
SpaceX has not published dimensions for this version, which has launched on Falcon 9
since 2024 at about 575 kg, nearly 22% lighter than V2 Mini (Spaceflight Now). GCAT records the
same 4.1 m body and 29.0 m span as V2 Mini, so we assume the V2 Mini envelope. This is the
largest single assumption in the index. If the arrays were 25% smaller, the facing TOI
would fall by about 10%.
"""
[[design.sources]]
title = "Spaceflight Now, SpaceX launches first dedicated Starlink mission of 2025 (6 January 2025)"
url = "https://spaceflightnow.com/2025/01/06/live-coverage-spacex-to-launch-24-starlink-satellites-on-falcon-9-rocket-from-cape-canaveral-4/"
[[design.sources]]
title = "Mallama et al. 2023, Assessment of Brightness Mitigation Practices for Starlink Satellites"
url = "https://arxiv.org/abs/2309.14152"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "starlink-v2-mini-dtc"
label = "Starlink V2 Mini direct-to-cell"
family = "Starlink"
confidence = "assumed"
match = { gcat_bus = ["Starlink V2MD"], norad = [], name_regex = '^STARLINK[- ]\d+ \[DTC\]$' }
body = { a_m = 2.7, b_m = 4.1 }
arrays = { n = 2, length_m = 12.8, width_m = 4.1, tracking = "sun" }
extra_area_m2 = 0.0
alt_history = { shell_km = 360.0, until = "2026-01-01", ramp_until = "2026-10-01", raise_days = 45, descent_days = 120, transit_km = 350.0 }
notes = """
The direct-to-cell satellites use the V2 Mini bus with an added phone antenna and weigh
about 960 kg in GCAT. SpaceX has not published the antenna size, so we use the V2 Mini
envelope and add nothing for the antenna. They fly in low shells near 360 km, which makes
each one count about 1.8 times as much as a V2 Mini at 480 km.
"""
[[design.sources]]
title = "Mallama et al. 2023, Assessment of Brightness Mitigation Practices for Starlink Satellites"
url = "https://arxiv.org/abs/2309.14152"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "starlink-v3"
label = "Starlink V3"
family = "Starlink"
confidence = "proxy"
match = { gcat_bus = ["Starlink V3"], norad = [], name_regex = '^STARLINK[- ][4-9]\d{4}$' }
body = { a_m = 2.7, b_m = 6.4 }
arrays = { n = 2, length_m = 20.2, width_m = 6.4, tracking = "sun" }
extra_area_m2 = 0.0
notes = """
SpaceX has not published V3 dimensions. We use the full-size Gen2 satellite from SpaceX's
October 2022 FCC filing as listed by McDowell, with a 6.4 x 2.7 m bus and two 6.4 x 20.2 m
solar arrays (two by analogy with V2 Mini). GCAT records V3 with an 8.1 m body and a 60 m span,
which gives a similar area through the generic model. The first 26 were deployed by
Starship in September 2026 and were still raising their orbits on the catalog date.
"""
[[design.sources]]
title = "McDowell, Starlink satellite dimensions from SpaceX's October 2022 FCC filing"
url = "https://planet4589.org/astro/starsim/index.html"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "starshield"
label = "Starshield"
family = "Starlink"
confidence = "proxy"
match = { gcat_bus = ["Starshield"], norad = [] }
body = { a_m = 2.7, b_m = 4.1 }
arrays = { n = 2, length_m = 12.8, width_m = 4.1, tracking = "sun" }
extra_area_m2 = 0.0
notes = """
Starshield satellites are classified and no dimensions are published. GCAT records them
with the same 4.1 m body and 29.0 m span as V2 Mini (the span flagged as a guess) and with
masses of 575 to 800 kg that match the V2 Mini family, so we use the V2 Mini envelope. If they were
the size of Starlink v1.5 instead, the facing TOI would fall by about 3%. Orbits come from
CelesTrak where it lists them and from GCAT otherwise.
"""
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"
[[design.sources]]
title = "Mallama et al. 2023, Assessment of Brightness Mitigation Practices for Starlink Satellites"
url = "https://arxiv.org/abs/2309.14152"

# ------------------------------------------------------------------ AST SpaceMobile
[[design]]
id = "ast-bluebird-block1"
label = "AST SpaceMobile BlueWalker 3 and BlueBird Block 1"
family = "AST SpaceMobile"
confidence = "published"
match = { gcat_bus = ["BW3"], norad = [], name_regex = '^(BLUEWALKER-3|SPACEMOBILE-00[1-5])$' }
arrays = { n = 1, length_m = 8.024, width_m = 8.024, tracking = "earth" }
extra_area_m2 = 0.0
notes = """
BlueWalker 3 and BlueBirds 1 to 5 each unfold a 693 square foot (64.4 m2) phased array.
The solar cells are on the back of the array, which faces Earth, so the whole array counts
in both the absolute and the facing area. We model the array as a square of that area to
get its perimeter. The bus sits behind the array and adds nothing seen from below.
"""
[[design.sources]]
title = "AST SpaceMobile, Commercial Satellites Arrive at Cape Canaveral (8 August 2024)"
url = "https://www.businesswire.com/news/home/20240808143608/en/AST-SpaceMobile%E2%80%99s-Commercial-Satellites-Arrive-at-Cape-Canaveral-For-Upcoming-Launch"
[[design.sources]]
title = "Space.com, SpaceX launches 5 giant BlueBird smartphone satellites for AST SpaceMobile, lands rocket (12 September 2024)"
url = "https://www.space.com/spacex-ast-spacemobile-bluebird-launch-september-2024"
[[design.sources]]
title = "Space.com, Satellite unfurls biggest commercial communications array ever (November 2022)"
url = "https://space.com/bluewalker-3-satellite-deploys-largest-commercial-array"

[[design]]
id = "ast-bluebird-block2"
label = "AST SpaceMobile BlueBird Block 2"
family = "AST SpaceMobile"
confidence = "published"
match = { gcat_bus = ["BB Block-2"], norad = [], name_regex = '^SPACEMOBILE-(0(0[6-9]|[1-9]\d)|[1-9]\d{2})$' }
arrays = { n = 1, length_m = 14.932, width_m = 14.932, tracking = "earth" }
extra_area_m2 = 0.0
notes = """
AST SpaceMobile gives the Block 2 array as nearly 2,400 square feet (223 m2), about three
and a half times the Block 1 array. As for Block 1, the array faces Earth with the solar cells on its
back and is modelled as a square of that area.
"""
[[design.sources]]
title = "Satnews, AST SpaceMobile deploys BlueBird 6, largest commercial array in LEO (24 December 2025)"
url = "https://satnews.com/2025/12/24/ast-spacemobile-deploys-bluebird-6-largest-commercial-array-in-leo"
[[design.sources]]
title = "Space.com, SpaceX launches 5 giant BlueBird smartphone satellites for AST SpaceMobile, lands rocket (12 September 2024)"
url = "https://www.space.com/spacex-ast-spacemobile-bluebird-launch-september-2024"

# ------------------------------------------------------------------ Stations
[[design]]
id = "iss"
label = "International Space Station"
family = "Stations"
confidence = "estimated"
match = { gcat_bus = [], norad = [25544] }
direct = { A_abs_m2 = 4300.0, A_fac_m2 = 2550.0, P_fac_m = 1180.0 }
notes = """
Counted from its documented parts as one object; docked modules and visiting vehicles
carry the station's catalog number and are not counted separately. Eight solar array
wings of 107 x 38 ft give 3,022 m2 (Lockheed Martin); they track the Sun and count at one
half in the facing area. Six heat-rejection radiators of 75 x 11 ft add 460 m2 (Boeing),
also held edge-on to the Sun and counted at one half. The 94 m truss at 4.5 m wide adds
423 m2, and the pressurized modules (67 m along the main axis at about 4.2 m, plus the
cross-axis modules) add about 390 m2; the station flies with these parallel to the
ground, so they count in full. That gives about 4,300 m2 absolute and 2,550 m2 facing. The
newer roll-out arrays mostly cover the original wings and are not added, and neither are
the smaller arrays of the Russian segment. The perimeter of
the facing outline, estimated from the same parts, is about 1,180 m.
"""
[[design.sources]]
title = "NASA, Space Station Facts and Figures"
url = "https://www.nasa.gov/international-space-station/space-station-facts-and-figures/"
[[design.sources]]
title = "Lockheed Martin, Final Pair of Massive Solar Arrays Begin Providing Power to ISS (21 March 2009)"
url = "https://news.lockheedmartin.com/2009-03-21-Final-Pair-of-Massive-Lockheed-Martin-Solar-Arrays-Begin-Providing-Power-to-International-Space-Station"
[[design.sources]]
title = "Boeing, First of Twin Boeing-built Trusses Ready for International Space Station (24 September 2002)"
url = "https://boeing.mediaroom.com/2002-09-24-First-of-Twin-Boeing-built-Trusses-Ready-for-International-Space-Station"

[[design]]
id = "tiangong"
label = "Tiangong space station"
family = "Stations"
confidence = "estimated"
match = { gcat_bus = [], norad = [48274] }
direct = { A_abs_m2 = 770.0, A_fac_m2 = 495.0, P_fac_m = 390.0 }
notes = """
Counted as one object from its documented parts. Wentian and Mengtian each carry two solar
wings of about 110 m2, spanning about 55 m tip to tip (Xinhua). Xinhua describes these as
twice the array area of the Tianhe core module, which gives about 110 m2 for Tianhe's own
wings. The arrays total about 550 m2 and track the Sun, so they count at one half in the
facing area. Xinhua also gives nearly 400 m2 of solar cells for the finished station; we
use the wing area because the whole wing blocks light. The three modules (16.6 m and twice
17.9 m long, 4.2 m across) add about 220 m2 seen from below. That gives 770 m2 absolute and 495 m2 facing, with an outline
perimeter of about 390 m.
"""
[[design.sources]]
title = "Xinhua via Belt and Road Studies Network, China's space lab module powered by huge flexible solar panels (16 August 2022)"
url = "https://www.brsn.net/Latest%20News/20220816/20623_Chinas-space-lab-module-powered-by-huge-flexible-solar-panels.html"
[[design.sources]]
title = "Spaceflight Now, Wentian science module docks with China's space station (24 July 2022)"
url = "https://spaceflightnow.com/2022/07/24/wentian-science-module-docks-with-chinas-space-station/"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "space-shuttle"
label = "Space Shuttle orbiter"
family = "Crewed vehicles"
confidence = "estimated"
match = { gcat_bus = ["STS OV"], norad = [] }
direct = { A_abs_m2 = 300.0, A_fac_m2 = 300.0, P_fac_m = 102.0 }
notes = """
The orbiter flew from 1981 to 2011, so it appears only in the reconstructed history.
NASA gives a length of 122 ft (37.2 m) and a wingspan of 78 ft (23.8 m). The wing
reference area of 2,690 sq ft (249.9 m2) already includes the part of the wing inside the
fuselage. The nose section ahead of the wing and the body flap behind it add about 50 m2,
so the outline seen from above or below is about 300 m2. The orbiter's attitude varied
from mission to mission, so the facing area is taken as the same. The perimeter of the
outline, taken as a triangle 37.2 m long and 23.8 m across the base, is about 102 m.
GCAT records the orbiter as a 37.3 x 23.8 x 23.8 m box, which the generic model would
turn into 1,377 m2, more than the whole ISS at the orbiter's lower altitude.
"""
[[design.sources]]
title = "NASA, The Space Shuttle"
url = "https://www.nasa.gov/reference/the-space-shuttle/"
[[design.sources]]
title = "ESA, Shuttle technical facts"
url = "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Space_Shuttle/Shuttle_technical_facts"
[[design.sources]]
title = "Wikipedia, Space Shuttle orbiter (specifications: wing area)"
url = "https://en.wikipedia.org/wiki/Space_Shuttle_orbiter"
[[design.sources]]
title = "Xinhua via Belt and Road Studies Network, China's space lab module powered by huge flexible solar panels (16 August 2022)"
url = "https://www.brsn.net/Latest%20News/20220816/20623_Chinas-space-lab-module-powered-by-huge-flexible-solar-panels.html"
[[design.sources]]
title = "Spaceflight Now, Wentian science module docks with China's space station (24 July 2022)"
url = "https://spaceflightnow.com/2022/07/24/wentian-science-module-docks-with-chinas-space-station/"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

# ------------------------------------------------------------------ Other constellations
[[design]]
id = "amazon-leo"
label = "Amazon Leo (Kuiper)"
family = "Amazon Leo"
confidence = "assumed"
match = { gcat_bus = ["Kuiper"], norad = [], name_regex = '^(KUIPER|AMAZON[ -]?LEO)' }
body = { a_m = 2.0, b_m = 3.0 }
arrays = { n = 1, length_m = 12.0, width_m = 2.0, tracking = "sun" }
extra_area_m2 = 0.0
notes = """
Amazon has not published dimensions. Mallama et al. (2026) describe three antenna panels
that deploy into one Earth-facing panel and a single solar array that rotates about its
long axis to track the Sun, and find reflective characteristics similar to Starlink v1.
The paper gives no dimensions, so we assume a 2.0 x 3.0 m panel and one 2.0 x 12.0 m
array, 30 m2 face-on, the same order as Starlink v1's 26 m2. GCAT's figures (a 1.8 x 0.7 m body with a 5.0 m span, flagged as
guesses) would give about 4 m2, which does not fit the deployed antenna panels.
"""
[[design.sources]]
title = "Mallama et al. 2026, Brightness Characterization and Modeling for Amazon Leo Satellites"
url = "https://arxiv.org/abs/2601.07708"
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "oneweb"
label = "OneWeb"
family = "OneWeb"
confidence = "estimated"
area_model = "gcat"
match = { gcat_bus = [], norad = [], name_regex = '^ONEWEB-\d+' }
notes = """
OneWeb has not published the array size, so the generic model is applied to GCAT's
dimensions for the Arrow bus, a 1.3 x 1.0 m box with two arrays across a 5.0 m span. The
satellites are matched by name because GCAT also uses the Arrow bus for other operators'
satellites.
"""
[[design.sources]]
title = "McDowell, General Catalog of Artificial Space Objects (GCAT)"
url = "https://planet4589.org/space/gcat/"

[[design]]
id = "qianfan"
label = "Qianfan (Thousand Sails)"
family = "Qianfan"
confidence = "estimated"
area_model = "gcat"
match = { gcat_bus = ["Qianfan"], norad = [], name_regex = '^QIANFAN' }
notes = """
No dimensions are published, so the generic model is applied to GCAT's dimensions, a
flat panel 3.0 m across with one array across a 10.0 m span. Mallama et al. (2024) fit
their observations with a nadir-facing antenna panel and a solar array held facing the
zenith while the Sun passed overhead, and expect the array to turn toward the Sun at other
times; the generic model counts it at one half. Some of these satellites are tumbling
